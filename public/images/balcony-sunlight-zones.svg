<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <rect width="800" height="450" fill="#F8FAFC" rx="12"/>
  <rect x="20" y="20" width="760" height="410" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="50" y="60" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A">Indian Balcony Sunlight Zones &amp; Plant Placement</text>
  <text x="50" y="85" font-family="system-ui, sans-serif" font-size="14" fill="#64748B">Map your balcony exposure before buying pots</text>

  <!-- Zone 1: Direct Sun (Railing) -->
  <g transform="translate(50, 110)">
    <rect width="210" height="280" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="105" cy="50" r="24" fill="#F59E0B"/>
    <text x="105" y="100" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#92400E" text-anchor="middle">Zone 1: Direct Sun</text>
    <text x="105" y="125" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#B45309" text-anchor="middle">5-7+ Hours Daily Sun</text>
    <line x1="20" y1="140" x2="190" y2="140" stroke="#FDE68A" stroke-width="2"/>
    <text x="30" y="170" font-family="system-ui, sans-serif" font-size="13" fill="#78350F">• Bougainvillea</text>
    <text x="30" y="195" font-family="system-ui, sans-serif" font-size="13" fill="#78350F">• Tulsi (Holy Basil)</text>
    <text x="30" y="220" font-family="system-ui, sans-serif" font-size="13" fill="#78350F">• Mogra (Jasmine)</text>
    <text x="30" y="245" font-family="system-ui, sans-serif" font-size="13" fill="#78350F">• Curry Leaves</text>
    <text x="30" y="270" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#B45309">Location: Outer Railing</text>
  </g>

  <!-- Zone 2: Morning / Partial Sun -->
  <g transform="translate(295, 110)">
    <rect width="210" height="280" rx="8" fill="#DCFCE7" stroke="#10B981" stroke-width="2"/>
    <circle cx="105" cy="50" r="24" fill="#10B981"/>
    <text x="105" y="100" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#065F46" text-anchor="middle">Zone 2: Partial Sun</text>
    <text x="105" y="125" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#047857" text-anchor="middle">2-4 Hours Morning Sun</text>
    <line x1="20" y1="140" x2="190" y2="140" stroke="#A7F3D0" stroke-width="2"/>
    <text x="30" y="170" font-family="system-ui, sans-serif" font-size="13" fill="#064E3B">• Money Plant (Pothos)</text>
    <text x="30" y="195" font-family="system-ui, sans-serif" font-size="13" fill="#064E3B">• Peace Lily</text>
    <text x="30" y="220" font-family="system-ui, sans-serif" font-size="13" fill="#064E3B">• Mint (Pudina)</text>
    <text x="30" y="245" font-family="system-ui, sans-serif" font-size="13" fill="#064E3B">• Syngonium</text>
    <text x="30" y="270" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#047857">Location: Balcony Middle</text>
  </g>

  <!-- Zone 3: Bright Indirect / Shaded -->
  <g transform="translate(540, 110)">
    <rect width="210" height="280" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="105" cy="50" r="24" fill="#3B82F6"/>
    <text x="105" y="100" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1E40AF" text-anchor="middle">Zone 3: Bright Shade</text>
    <text x="105" y="125" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#2563EB" text-anchor="middle">Diffused Daylight</text>
    <line x1="20" y1="140" x2="190" y2="140" stroke="#BFDBFE" stroke-width="2"/>
    <text x="30" y="170" font-family="system-ui, sans-serif" font-size="13" fill="#1E3A8A">• Snake Plant</text>
    <text x="30" y="195" font-family="system-ui, sans-serif" font-size="13" fill="#1E3A8A">• ZZ Plant</text>
    <text x="30" y="220" font-family="system-ui, sans-serif" font-size="13" fill="#1E3A8A">• Boston Fern</text>
    <text x="30" y="245" font-family="system-ui, sans-serif" font-size="13" fill="#1E3A8A">• Spider Plant</text>
    <text x="30" y="270" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2563EB">Location: Inner Wall Corner</text>
  </g>
</svg>
