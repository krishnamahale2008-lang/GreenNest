<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="startBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="50%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#startBg)"/>

  <!-- Balcony workbench surface -->
  <path d="M0 430 L1200 430 L1200 675 L0 675 Z" fill="#E7D8C5"/>
  <line x1="0" y1="430" x2="1200" y2="430" stroke="#CBB499" stroke-width="4"/>

  <!-- Step 1: Pot selection (Terracotta pot & plastic railing trough) -->
  <g transform="translate(100, 200)">
    <!-- Terracotta pot with drainage hole callout -->
    <path d="M30 140 L45 230 Q80 240 115 230 L130 140 Z" fill="#C0583E"/>
    <ellipse cx="80" cy="140" rx="50" ry="10" fill="#9A3412"/>
    <!-- drainage saucer underneath -->
    <ellipse cx="80" cy="235" rx="58" ry="8" fill="#7C2D12"/>
    <!-- Railing planter next to it -->
    <rect x="150" y="150" width="120" height="80" rx="8" fill="#15803D"/>
    <!-- label -->
    <rect x="35" y="255" width="220" height="30" rx="6" fill="#FFFFFF" stroke="#059669"/>
    <text x="145" y="275" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">Step 1: Choose Pots &amp; Drainage</text>
  </g>

  <!-- Step 2: Soil mixing (Cocopeat block, Vermicompost sack, garden trowel) -->
  <g transform="translate(460, 180)">
    <!-- Brown cocopeat compressed brick -->
    <rect x="30" y="160" width="100" height="60" rx="4" fill="#78350F"/>
    <text x="80" y="195" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FEF3C7" text-anchor="middle">Cocopeat</text>
    <!-- Vermicompost bag -->
    <path d="M150 140 L230 140 L240 230 L140 230 Z" fill="#3B82F6"/>
    <text x="190" y="185" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#EFF6FF" text-anchor="middle">Organic</text>
    <text x="190" y="202" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#DBEAFE" text-anchor="middle">Compost</text>
    <!-- Gardening trowel / khurpi -->
    <path d="M100 240 L120 220 L160 225 L125 250 Z" fill="#94A3B8"/>
    <rect x="80" y="245" width="30" height="10" rx="3" fill="#D97706" transform="rotate(-30 80 245)"/>
    <!-- label -->
    <rect x="30" y="275" width="220" height="30" rx="6" fill="#FFFFFF" stroke="#059669"/>
    <text x="140" y="295" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">Step 2: Aerated Soil Mix</text>
  </g>

  <!-- Step 3: Planting & Sunlight Mapping -->
  <g transform="translate(820, 160)">
    <!-- Potted young green plant with watering spray -->
    <path d="M40 180 L55 260 Q85 270 115 260 L130 180 Z" fill="#EA580C"/>
    <ellipse cx="85" cy="180" rx="45" ry="9" fill="#9A3412"/>
    <!-- Young healthy seedling stems -->
    <path d="M85 180 Q60 120 50 80 Q90 100 85 180" fill="#22C55E"/>
    <path d="M85 180 Q110 110 130 70 Q95 110 85 180" fill="#16A34A"/>
    <circle cx="85" cy="65" r="25" fill="#4ADE80"/>
    <!-- Sun icon beaming down -->
    <circle cx="190" cy="70" r="28" fill="#F59E0B"/>
    <g stroke="#F59E0B" stroke-width="4" stroke-linecap="round">
      <line x1="190" y1="30" x2="190" y2="15"/>
      <line x1="190" y1="110" x2="190" y2="125"/>
      <line x1="150" y1="70" x2="135" y2="70"/>
      <line x1="230" y1="70" x2="245" y2="70"/>
      <line x1="162" y1="42" x2="151" y2="31"/>
      <line x1="218" y1="98" x2="229" y2="109"/>
      <line x1="162" y1="98" x2="151" y2="109"/>
      <line x1="218" y1="42" x2="229" y2="31"/>
    </g>
    <!-- label -->
    <rect x="25" y="295" width="220" height="30" rx="6" fill="#FFFFFF" stroke="#059669"/>
    <text x="135" y="315" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">Step 3: Sun Mapping &amp; Care</text>
  </g>

  <!-- Title Badge -->
  <rect x="50" y="40" width="580" height="90" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#059669" stroke-width="2"/>
  <text x="75" y="80" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#065F46">How to Start a Balcony Garden</text>
  <text x="75" y="108" font-family="system-ui, sans-serif" font-size="15" fill="#047857">Beginner Guide for Small Indian Apartments • Soil, Pots &amp; Sunlight</text>
</svg>
