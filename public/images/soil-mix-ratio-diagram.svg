<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <rect width="800" height="450" fill="#F8FAFC" rx="12"/>
  <rect x="20" y="20" width="760" height="410" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="50" y="60" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A">Ideal Lightweight Potting Soil Mix for Indian Balconies</text>
  <text x="50" y="85" font-family="system-ui, sans-serif" font-size="14" fill="#64748B">Optimal moisture retention, aeration, and light weight for slab safety</text>

  <!-- Donut Chart / Proportion representation -->
  <g transform="translate(180, 240)">
    <!-- 40% Cocopeat (Brown) -->
    <circle cx="0" cy="0" r="100" fill="transparent" stroke="#78350F" stroke-width="50" stroke-dasharray="251 377" stroke-dashoffset="0"/>
    <!-- 30% Vermicompost (Green) -->
    <circle cx="0" cy="0" r="100" fill="transparent" stroke="#15803D" stroke-width="50" stroke-dasharray="188 440" stroke-dashoffset="-251"/>
    <!-- 20% Garden Red Soil (Terracotta) -->
    <circle cx="0" cy="0" r="100" fill="transparent" stroke="#C0583E" stroke-width="50" stroke-dasharray="125 503" stroke-dashoffset="-439"/>
    <!-- 10% Perlite / River Sand / Neem Khali (Gold) -->
    <circle cx="0" cy="0" r="100" fill="transparent" stroke="#D97706" stroke-width="50" stroke-dasharray="63 565" stroke-dashoffset="-564"/>
    
    <text x="0" y="-8" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#0F172A" text-anchor="middle">Balcony</text>
    <text x="0" y="16" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#059669" text-anchor="middle">Pot Mix</text>
  </g>

  <!-- Legend -->
  <g transform="translate(360, 130)">
    <!-- Cocopeat -->
    <rect x="0" y="0" width="24" height="24" rx="4" fill="#78350F"/>
    <text x="36" y="18" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0F172A">40% Washed Cocopeat</text>
    <text x="36" y="38" font-family="system-ui, sans-serif" font-size="13" fill="#64748B">Retains moisture in summer without waterlogging roots</text>

    <!-- Vermicompost -->
    <rect x="0" y="65" width="24" height="24" rx="4" fill="#15803D"/>
    <text x="36" y="83" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0F172A">30% Vermicompost or Cow Dung Manure</text>
    <text x="36" y="103" font-family="system-ui, sans-serif" font-size="13" fill="#64748B">Provides steady organic nitrogen, phosphorus, and microbes</text>

    <!-- Red Soil -->
    <rect x="0" y="130" width="24" height="24" rx="4" fill="#C0583E"/>
    <text x="36" y="148" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0F172A">20% Screened Red Soil / Garden Soil</text>
    <text x="36" y="168" font-family="system-ui, sans-serif" font-size="13" fill="#64748B">Anchors plant roots firmly against high balcony winds</text>

    <!-- Aeration / Neem -->
    <rect x="0" y="195" width="24" height="24" rx="4" fill="#D97706"/>
    <text x="36" y="213" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0F172A">10% River Sand / Perlite + Handful Neem Khali</text>
    <text x="36" y="233" font-family="system-ui, sans-serif" font-size="13" fill="#64748B">Prevents fungus, repels soil termites, ensures free drainage</text>
  </g>
</svg>
