<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2FBF5"/>
      <stop offset="50%" stop-color="#E8F7EE"/>
      <stop offset="100%" stop-color="#D4EEDC"/>
    </linearGradient>
    <linearGradient id="terracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A5F"/>
      <stop offset="100%" stop-color="#C0583E"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="darkLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
  </defs>

  <!-- Sky and apartment wall background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Modern apartment building outline in distance -->
  <rect x="750" y="100" width="130" height="340" fill="#E2E8F0" rx="4"/>
  <rect x="900" y="70" width="160" height="370" fill="#CBD5E1" rx="4"/>
  <rect x="1080" y="140" width="100" height="300" fill="#E2E8F0" rx="4"/>
  
  <!-- Distant windows -->
  <g fill="#94A3B8" opacity="0.4">
    <rect x="765" y="120" width="20" height="30" rx="2"/>
    <rect x="795" y="120" width="20" height="30" rx="2"/>
    <rect x="825" y="120" width="20" height="30" rx="2"/>
    <rect x="765" y="170" width="20" height="30" rx="2"/>
    <rect x="795" y="170" width="20" height="30" rx="2"/>
    <rect x="825" y="170" width="20" height="30" rx="2"/>
    <rect x="920" y="100" width="25" height="35" rx="2"/>
    <rect x="960" y="100" width="25" height="35" rx="2"/>
    <rect x="1000" y="100" width="25" height="35" rx="2"/>
    <rect x="920" y="150" width="25" height="35" rx="2"/>
    <rect x="960" y="150" width="25" height="35" rx="2"/>
    <rect x="1000" y="150" width="25" height="35" rx="2"/>
  </g>

  <!-- Balcony Deck Floor -->
  <path d="M0 450 L1200 450 L1200 675 L0 675 Z" fill="#E2D9CC"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="#C8BCAE" stroke-width="4"/>
  <line x1="0" y1="520" x2="1200" y2="520" stroke="#D5C9BA" stroke-width="2"/>
  <line x1="0" y1="590" x2="1200" y2="590" stroke="#D5C9BA" stroke-width="2"/>

  <!-- Balcony Modern Railing -->
  <g stroke="#334155" stroke-width="5" stroke-linecap="round">
    <line x1="40" y1="360" x2="1160" y2="360"/>
    <line x1="40" y1="450" x2="1160" y2="450"/>
    <!-- Vertical bars -->
    <line x1="80" y1="360" x2="80" y2="450"/>
    <line x1="160" y1="360" x2="160" y2="450"/>
    <line x1="240" y1="360" x2="240" y2="450"/>
    <line x1="320" y1="360" x2="320" y2="450"/>
    <line x1="400" y1="360" x2="400" y2="450"/>
    <line x1="480" y1="360" x2="480" y2="450"/>
    <line x1="560" y1="360" x2="560" y2="450"/>
    <line x1="640" y1="360" x2="640" y2="450"/>
    <line x1="720" y1="360" x2="720" y2="450"/>
    <line x1="800" y1="360" x2="800" y2="450"/>
    <line x1="880" y1="360" x2="880" y2="450"/>
    <line x1="960" y1="360" x2="960" y2="450"/>
    <line x1="1040" y1="360" x2="1040" y2="450"/>
    <line x1="1120" y1="360" x2="1120" y2="450"/>
  </g>

  <!-- Railing Planter Left -->
  <rect x="180" y="330" width="160" height="60" rx="8" fill="#15803D"/>
  <rect x="190" y="320" width="140" height="20" rx="4" fill="#166534"/>
  <!-- Trailing money plant foliage -->
  <path d="M200 330 C200 370 170 390 160 410 C150 430 170 440 180 430 C190 410 210 390 220 360" fill="none" stroke="#22C55E" stroke-width="3"/>
  <circle cx="160" cy="410" r="16" fill="url(#leafGrad)"/>
  <circle cx="175" cy="430" r="14" fill="url(#leafGrad)"/>
  <circle cx="210" cy="380" r="18" fill="url(#darkLeafGrad)"/>
  <circle cx="230" cy="360" r="16" fill="url(#leafGrad)"/>
  <circle cx="260" cy="340" r="20" fill="url(#leafGrad)"/>
  <circle cx="290" cy="350" r="18" fill="url(#darkLeafGrad)"/>
  <circle cx="310" cy="380" r="14" fill="url(#leafGrad)"/>

  <!-- Railing Planter Right -->
  <rect x="820" y="330" width="170" height="60" rx="8" fill="#C0583E"/>
  <circle cx="850" cy="320" r="22" fill="#F43F5E"/>
  <circle cx="880" cy="310" r="24" fill="#FB7185"/>
  <circle cx="910" cy="320" r="22" fill="#F43F5E"/>
  <circle cx="940" cy="315" r="25" fill="#E11D48"/>
  <circle cx="960" cy="330" r="18" fill="#FDA4AF"/>

  <!-- Large Terracotta Pot 1 (Center-Left) with Lush Palms & Tulsi -->
  <g transform="translate(420, 370)">
    <!-- Tulsi / Palm Foliage -->
    <path d="M70 40 Q40 -60 -20 -90 Q30 -50 70 30" fill="url(#leafGrad)"/>
    <path d="M80 30 Q80 -90 60 -150 Q100 -90 90 30" fill="url(#darkLeafGrad)"/>
    <path d="M90 35 Q140 -70 180 -110 Q130 -50 100 30" fill="url(#leafGrad)"/>
    <path d="M85 30 Q110 -110 130 -160 Q120 -80 95 30" fill="url(#darkLeafGrad)"/>
    <path d="M75 40 Q10 -30 -50 -50 Q10 -20 70 40" fill="url(#leafGrad)"/>
    
    <!-- Pot Body -->
    <ellipse cx="80" cy="70" rx="65" ry="12" fill="#D97706" opacity="0.3"/>
    <path d="M25 70 L40 180 Q80 190 120 180 L135 70 Z" fill="url(#terracotta)"/>
    <ellipse cx="80" cy="70" rx="55" ry="10" fill="#B45309"/>
    <!-- Soil -->
    <ellipse cx="80" cy="70" rx="50" ry="8" fill="#451A03"/>
    <!-- Traditional Indian pot motif -->
    <line x1="38" y1="105" x2="122" y2="105" stroke="#FDE68A" stroke-width="2" stroke-dasharray="4 3"/>
  </g>

  <!-- Large Pot 2 (Left) with Snake Plant / Sansevieria -->
  <g transform="translate(100, 390)">
    <!-- Snake plant stiff leaves -->
    <path d="M50 80 Q45 0 35 -120 Q55 -40 60 80" fill="#047857"/>
    <path d="M42 -110 Q45 0 52 80" stroke="#FBBF24" stroke-width="3" fill="none"/>
    <path d="M65 80 Q75 10 90 -140 Q85 -50 75 80" fill="#065F46"/>
    <path d="M87 -130 Q75 10 70 80" stroke="#FBBF24" stroke-width="3" fill="none"/>
    <path d="M35 80 Q20 30 10 -60 Q35 0 45 80" fill="#059669"/>
    <!-- Pot -->
    <path d="M15 80 L28 175 Q60 185 92 175 L105 80 Z" fill="#475569"/>
    <ellipse cx="60" cy="80" rx="45" ry="8" fill="#334155"/>
    <ellipse cx="60" cy="80" rx="40" ry="6" fill="#271810"/>
  </g>

  <!-- Large Pot 3 (Right) with Flowering Bougainvillea & Mogra -->
  <g transform="translate(680, 360)">
    <!-- Leaves -->
    <circle cx="50" cy="50" r="45" fill="url(#darkLeafGrad)"/>
    <circle cx="110" cy="40" r="50" fill="url(#leafGrad)"/>
    <circle cx="80" cy="0" r="55" fill="url(#leafGrad)"/>
    <!-- Flowers -->
    <circle cx="70" cy="-10" r="10" fill="#F43F5E"/>
    <circle cx="100" cy="20" r="12" fill="#FB7185"/>
    <circle cx="45" cy="30" r="11" fill="#F43F5E"/>
    <circle cx="115" cy="-20" r="10" fill="#F43F5E"/>
    <circle cx="80" cy="45" r="12" fill="#FDA4AF"/>
    <!-- Pot -->
    <path d="M25 80 L38 190 Q80 200 122 190 L135 80 Z" fill="#D97706"/>
    <ellipse cx="80" cy="80" rx="55" ry="10" fill="#B45309"/>
    <ellipse cx="80" cy="80" rx="50" ry="8" fill="#3F1D0B"/>
  </g>

  <!-- Small Hanging Basket -->
  <g transform="translate(970, 80)">
    <line x1="80" y1="0" x2="60" y2="120" stroke="#78350F" stroke-width="2"/>
    <line x1="80" y1="0" x2="100" y2="120" stroke="#78350F" stroke-width="2"/>
    <path d="M50 120 Q80 150 110 120 Z" fill="#92400E"/>
    <!-- Overflowing ferns -->
    <path d="M55 125 Q30 160 20 200" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
    <path d="M70 125 Q50 180 50 220" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
    <path d="M90 125 Q100 170 110 210" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
    <path d="M105 125 Q130 160 140 195" stroke="#047857" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Modern Indian Balcony Accents: Watering Can & Warm Lantern -->
  <g transform="translate(320, 520)">
    <!-- Small steel watering can -->
    <ellipse cx="40" cy="60" rx="28" ry="18" fill="#94A3B8"/>
    <rect x="25" y="30" width="30" height="30" fill="#64748B" rx="4"/>
    <path d="M55 45 L90 25" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
    <path d="M25 45 C5 35 5 70 20 65" fill="none" stroke="#64748B" stroke-width="5"/>
  </g>

  <!-- Headline Overlay Card / Banner -->
  <rect x="60" y="50" width="520" height="130" rx="16" fill="#FFFFFF" fill-opacity="0.92"/>
  <rect x="60" y="50" width="520" height="130" rx="16" stroke="#10B981" stroke-width="2"/>
  <text x="90" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#065F46">GreenNest Balcony Gardening</text>
  <text x="90" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#047857">Balcony Garden Ideas India for Small Homes</text>
  <text x="90" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569">Compact Space • Heat-Hardy Plants • Low Budget Indian Flats</text>
</svg>
